{% extends "auth_base.html" %}
{% block title %}Reset your password · Ember{% endblock %}

{% block content %}
  <div class="card-pad">
    <h1 class="text-2xl font-semibold tracking-tight">Reset your password</h1>
    <p class="mt-2 text-sm text-charcoal-600">
      Enter your email and we'll send a link to choose a new password.
    </p>

    <form method="post" action="/forgot-password" class="mt-6 space-y-4">
      <div>
        <label class="label" for="email">Email</label>
        <input class="input" id="email" name="email" type="email" required autocomplete="email"
               autofocus />
      </div>
      <button type="submit" class="btn-primary w-full">Send reset link</button>
    </form>

    <p class="mt-6 text-center text-sm text-charcoal-500">
      Remembered it?
      <a href="/signin" class="font-medium text-ember-700 hover:text-ember-800">Sign in</a>
    </p>
  </div>
{% endblock %}
