{# Polling response: only messages newer than the client's cursor.
   The element re-arms itself with the new cursor, so each poll is cheap. #}
{% for view in views %}
  {% include "fragments/message_row.html" %}
{% endfor %}
<div id="message-poller"
     hx-get="{{ poll_url }}?after_seq={{ latest_seq }}"
     hx-trigger="every {{ POLLING_INTERVAL_MS }}ms"
     hx-swap="outerHTML"
     hx-target="this"
     data-latest-seq="{{ latest_seq }}"
     hx-on::after-swap="window.emberScrollIfAtBottom && window.emberScrollIfAtBottom()"></div>
